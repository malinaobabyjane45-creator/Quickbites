{% extends 'delivery/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
  <h2>{% if form.instance.pk %}Edit Restaurant{% else %}Add Restaurant{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn">Save</button>
  </form>
{% endblock %}
